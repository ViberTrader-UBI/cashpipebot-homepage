<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CashPipeBot</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --fg: #f2f2f2; --muted: #a0a0a0; --line: #2a2d33; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--fg); padding: 24px 16px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 480px; width: 100%; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: .2px; }
  p { margin: 6px 0; line-height: 1.6; }
  .ko { font-size: 17px; }
  .en { font-size: 15px; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
</style>
</head>
<body>
<main>
  <h1>CashPipeBot</h1>
  <p class="ko">홈페이지 점검 중입니다. 잠시 후 다시 찾아 주세요.</p>
  <hr>
  <p class="en">This site is temporarily under maintenance.<br>Please check back soon.</p>
</main>
</body>
</html>
